apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: edge
spec:
  parentRefs:
  - name: platform
    sectionName: identity
  hostnames:
  - id.${BASE_DOMAIN}
  rules:
  - backendRefs:
    - name: keycloak
      namespace: identity
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: edge-keycloak
  namespace: identity
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: edge
  to:
  - group: ''
    kind: Service
    name: keycloak
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: edge
spec:
  parentRefs:
  - name: platform
    sectionName: apps
  hostnames:
  - longhorn.apps.${BASE_DOMAIN}
  rules:
  - backendRefs:
    - name: longhorn-frontend
      namespace: longhorn-system
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: edge-longhorn
  namespace: longhorn-system
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: edge
  to:
  - group: ''
    kind: Service
    name: longhorn-frontend
