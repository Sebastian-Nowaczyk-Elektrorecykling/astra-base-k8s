apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bootstrap-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Elektro private cluster root
  secretName: platform-root-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    # Client trust distribution is manual; routine renewal must retain this key.
    # This does not extend the lifetime of roots already installed on clients.
    rotationPolicy: Never
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: bootstrap-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca
spec:
  ca:
    secretName: platform-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-tls
  namespace: edge
spec:
  secretName: edge-tls
  duration: 2160h
  renewBefore: 720h
  dnsNames:
  # A top-level *.internal wildcard is rejected by common TLS clients. Profiles
  # using that suffix add exact ordinary-app SANs; see docs/tls.md. The grouped
  # wildcards below work, as does *.production.internal for a deeper profile.
  - '*.${INTERNAL_DOMAIN}'
  - '*.admin.${INTERNAL_DOMAIN}'
  - '*.test.${INTERNAL_DOMAIN}'
  - '*.staging.${INTERNAL_DOMAIN}'
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: platform-ca
