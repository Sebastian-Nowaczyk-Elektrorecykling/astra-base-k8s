  validations:
  - expression: object.metadata.name == 'platform' && object.spec.controllerName == 'gateway.envoyproxy.io/gatewayclass-controller'
    message: Only the platform GatewayClass is allowed.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
