apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: astra-workload-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) && (!has(object.spec.hostPID) || !object.spec.hostPID)
      && (!has(object.spec.hostIPC) || !object.spec.hostIPC)
    message: Workloads cannot use host namespaces.
  - expression: object.spec.containers.all(c, (!has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort ==
      0)) && (!has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged))
    message: Workloads cannot use host ports or privileged containers.
  - expression: '!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))'
    message: Workloads cannot mount the host filesystem.
  matchConditions:
  - name: condition-0
    expression: '!(request.namespace in ["kube-system", "kube-public", "kube-node-lease", "flux-system", "longhorn-system",
      "cnpg-system", "cert-manager", "kyverno", "envoy-gateway-system", "gpu-system", "identity", "authorization",
      "edge"])'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: astra-workload-pods
spec:
  policyName: astra-workload-pods
  validationActions:
  - Deny
