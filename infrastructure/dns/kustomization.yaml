apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dns-system
resources:
- resources.yaml
- network.yaml
configMapGenerator:
- name: lan-dns
  files:
  - Corefile
  - internal.db
  - hosts.db
generatorOptions:
  # CoreDNS reloads both configuration and zone files without restarting pods.
  disableNameSuffixHash: true
