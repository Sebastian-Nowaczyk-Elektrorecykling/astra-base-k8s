apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    k8sServiceHost: ${API_HOST}
    bgpControlPlane:
      enabled: ${BGP_ENABLED}
  valuesFrom:
  - kind: ConfigMap
    name: cilium-values
    valuesKey: values.yaml
