kubeProxyReplacement: true
# Apply GitOps networking configuration changes without a manual pod restart.
rollOutCiliumPods: true
ipam:
  mode: kubernetes
k8sServicePort: 6443
routingMode: tunnel
tunnelProtocol: vxlan
# Keep replies through the controller that received the routed service traffic.
loadBalancer:
  mode: snat
operator:
  replicas: 1
  rollOutPods: true
l2announcements:
  enabled: false
l2podAnnouncements:
  enabled: false
bgpControlPlane:
  enabled: true
k8sClientRateLimit:
  qps: 40
  burst: 80
gatewayAPI:
  enabled: false
ingressController:
  enabled: false
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
securityContext:
  privileged: true
encryption:
  enabled: true
  type: wireguard
