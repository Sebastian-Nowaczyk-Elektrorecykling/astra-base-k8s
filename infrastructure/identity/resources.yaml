apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: identity
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  elektro-realm.json: |
    {
      "realm": "elektro",
      "enabled": true,
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "bruteForceProtected": true,
      "sslRequired": "external",
      "accessTokenLifespan": 300,
      "roles": {
        "realm": [
          {
            "name": "platform-admin"
          }
        ]
      },
      "clients": [
        {
          "clientId": "elektro-edge",
          "name": "Elektro protected gateway",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${EDGE_OIDC_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "fullScopeAllowed": false,
          "redirectUris": [
            "https://longhorn.admin.${INTERNAL_DOMAIN}/oauth2/callback",
            "https://grafana.admin.${INTERNAL_DOMAIN}/oauth2/callback"
          ],
          "webOrigins": [],
          "defaultClientScopes": [
            "profile",
            "email"
          ],
          "protocolMappers": [
            {
              "name": "edge-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "elektro-edge",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        elektro.local/workloads: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.7.3
        args:
        - start
        - --import-realm
        env:
        - name: INTERNAL_DOMAIN
          value: ${INTERNAL_DOMAIN}
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-db-rw.identity.svc.cluster.local:5432/keycloak?sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_HOSTNAME
          value: https://${IDENTITY_HOST}
        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_PROXY_TRUSTED_ADDRESSES
          value: ${POD_CIDR}
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: KC_METRICS_ENABLED
          value: 'true'
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: bootstrap-admin
        - name: KC_HOSTNAME_ADMIN
          value: https://keycloak.admin.${INTERNAL_DOMAIN}
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-db-app
              key: password
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-bootstrap
              key: password
        - name: EDGE_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: edge-oidc-import
              key: client-secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        startupProbe:
          httpGet:
            path: /health/started
            port: management
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health/ready
            port: management
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: management
          periodSeconds: 30
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 1536Mi
        volumeMounts:
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
        - name: pg-ca
          mountPath: /etc/postgres-ca
          readOnly: true
      volumes:
      - name: realm
        configMap:
          name: keycloak-realm
      - name: pg-ca
        secret:
          secretName: keycloak-db-ca
          items:
          - key: ca.crt
            path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
spec:
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: http
