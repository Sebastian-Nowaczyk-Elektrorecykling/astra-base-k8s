apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: identity
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  astra-realm.json: "{\n  \"realm\": \"astra\",\n  \"enabled\": true,\n  \"registrationAllowed\": false,\n  \"loginWithEmailAllowed\"\
    : true,\n  \"duplicateEmailsAllowed\": false,\n  \"resetPasswordAllowed\": true,\n  \"bruteForceProtected\"\
    : true,\n  \"sslRequired\": \"external\",\n  \"accessTokenLifespan\": 300,\n  \"roles\": {\n    \"realm\": [\n\
    \      {\n        \"name\": \"platform-admin\"\n      }\n    ]\n  },\n  \"clients\": [\n    {\n      \"clientId\"\
    : \"astra-edge\",\n      \"name\": \"Astra protected gateway\",\n      \"enabled\": true,\n      \"protocol\"\
    : \"openid-connect\",\n      \"publicClient\": false,\n      \"secret\": \"${EDGE_OIDC_CLIENT_SECRET}\",\n \
    \     \"standardFlowEnabled\": true,\n      \"directAccessGrantsEnabled\": false,\n      \"serviceAccountsEnabled\"\
    : false,\n      \"fullScopeAllowed\": false,\n      \"redirectUris\": [\n        \"https://longhorn.apps.${BASE_DOMAIN}/oauth2/callback\"\
    \n      ],\n      \"webOrigins\": [],\n      \"defaultClientScopes\": [\n        \"profile\",\n        \"email\"\
    \n      ],\n      \"protocolMappers\": [\n        {\n          \"name\": \"edge-audience\",\n          \"protocol\"\
    : \"openid-connect\",\n          \"protocolMapper\": \"oidc-audience-mapper\",\n          \"config\": {\n  \
    \          \"included.client.audience\": \"astra-edge\",\n            \"access.token.claim\": \"true\",\n  \
    \          \"id.token.claim\": \"false\"\n          }\n        }\n      ]\n    }\n  ]\n}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        astra.local/workloads: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.7.3
        args:
        - start
        - --import-realm
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-db-rw.identity.svc.cluster.local:5432/keycloak?sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_HOSTNAME
          value: https://id.${BASE_DOMAIN}
        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_PROXY_TRUSTED_ADDRESSES
          value: ${POD_CIDR}
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: KC_METRICS_ENABLED
          value: 'true'
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: bootstrap-admin
        - name: BASE_DOMAIN
          value: ${BASE_DOMAIN}
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-db-app
              key: password
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-bootstrap
              key: password
        - name: EDGE_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: edge-oidc-import
              key: client-secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        startupProbe:
          httpGet:
            path: /health/started
            port: management
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health/ready
            port: management
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: management
          periodSeconds: 30
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 1536Mi
        volumeMounts:
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
        - name: pg-ca
          mountPath: /etc/postgres-ca
          readOnly: true
      volumes:
      - name: realm
        configMap:
          name: keycloak-realm
      - name: pg-ca
        secret:
          secretName: keycloak-db-ca
          items:
          - key: ca.crt
            path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
spec:
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: http
