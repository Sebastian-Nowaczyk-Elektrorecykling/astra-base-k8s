apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 1
      createStorageClass: false
    defaultSettings:
      defaultDataPath: /var/lib/longhorn
      createDefaultDiskLabeledNodes: true
      defaultReplicaCount: '{"v1":"1","v2":"1"}'
      replicaSoftAntiAffinity: false
      storageOverProvisioningPercentage: 100
      storageMinimalAvailablePercentage: 15
      systemManagedComponentsNodeSelector: astra.local/workloads:true
    longhornManager:
      nodeSelector:
        astra.local/workloads: 'true'
    longhornDriver:
      nodeSelector:
        astra.local/workloads: 'true'
    longhornUI:
      replicas: 1
      nodeSelector:
        astra.local/workloads: 'true'
    ingress:
      enabled: false
    csi:
      kubeletRootDir: /var/lib/kubelet
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
---
