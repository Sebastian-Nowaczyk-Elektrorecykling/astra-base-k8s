name: Validate infrastructure
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workstation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    container: debian:${{ matrix.debian }}-slim
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install workstation tools on fresh Debian
        run: bash scripts/prepare-workstation.sh
      - name: Exercise CLI tools and Flux bootstrap manifests
        run: bash tests/workstation.sh
      - name: Verify bootstrap and GitOps address handoff
        run: bash tests/cluster-config.sh
      - name: Verify the removed-node reboot guard
        run: bash tests/node-rejoin-guard.sh
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.4
      - name: Install validation dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl -o /tmp/kubectl
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256 -o /tmp/kubectl.sha256
          cd /tmp
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          curl --fail --location --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o kind
          curl --fail --location --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum -o kind.sha256
          printf '%s  kind\n' "$(cut -d ' ' -f1 kind.sha256)" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: Check scripts and render pinned charts
        run: |
          for file in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$file"; done
          shellcheck -x -P SCRIPTDIR scripts/*.sh scripts/lib/*.sh tests/*.sh
          python tests/node-maintenance.py
          python tests/render.py --charts
      - name: Validate admission against Kubernetes 1.36
        run: |
          kind create cluster --name elektro-validation --wait 120s --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          kubectl create namespace app-demo
          bash tests/admission.sh
          bash tests/node-drain.sh
      - name: Verify Authorino starts as a non-root user
        run: bash tests/authorino-startup.sh
      - name: Clean up disposable cluster
        if: always()
        run: kind delete cluster --name elektro-validation
