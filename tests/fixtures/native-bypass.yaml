apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: edge
spec:
  parentRefs:
    - name: platform
      sectionName: identity
  hostnames:
    - id.example.com
  rules:
    - backendRefs:
        - name: longhorn-frontend
          namespace: longhorn-system
          port: 80
