apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: access
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./infrastructure/access
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
  dependsOn:
  - name: edge
  healthCheckExprs:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    current: has(status) && has(status.ancestors) && status.ancestors.size() >= 4 && status.ancestors.all(a, a.conditions.exists(c,
      c.type == 'Accepted' && c.status == 'True' && c.observedGeneration == metadata.generation))
---
