apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  BASE_CONTRACT_VERSION: '1'
  PG_IMAGE: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  FGA_MODEL_ID: NOT_CONFIGURED
  FGA_STORE_ID: NOT_CONFIGURED
  PUBLIC_EDGE_IP: NOT_CONFIGURED
  # Every profile must select its directly connected LAN router.
  BGP_ROUTER_IP: NOT_CONFIGURED
  BGP_LOCAL_ASN: '64513'
  BGP_PEER_ASN: '64512'
