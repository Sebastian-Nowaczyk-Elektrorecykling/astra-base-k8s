apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: edge
spec:
  parentRefs:
  - name: platform
    sectionName: apps
  hostnames:
  - demo.${INTERNAL_DOMAIN}
  rules:
  - backendRefs:
    - name: demo
      namespace: app-demo
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: edge-demo
  namespace: app-demo
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: edge
  to:
  - group: ''
    kind: Service
    name: demo
