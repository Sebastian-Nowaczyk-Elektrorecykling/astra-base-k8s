apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: api-vip
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/api-vip
  prune: false
  wait: true
  dependsOn:
  - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
