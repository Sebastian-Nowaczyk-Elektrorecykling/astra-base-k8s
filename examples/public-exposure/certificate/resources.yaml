apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-edge-tls
  namespace: edge
spec:
  secretName: public-edge-tls
  dnsNames:
  - ${IDENTITY_HOST}
  - fuzzy.elektrorecykling.pl
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns
